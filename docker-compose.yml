version: '3.8'

services:
  djangoapp23084:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:25084"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "0.0.0.0:25084:25084"
    expose:
      - "25084"
    depends_on:
      - mydb23084
    environment:
      - POSTGRES_NAME=inpc_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=mydb23084
      - POSTGRES_PORT=5432
    networks:
      - web_network

  mydb23084:
    image: postgis/postgis:13-3.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=inpc_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "24084:5432"
    networks:
      - web_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  web_network:
    driver: bridge
