version: '3.8'

services:
  djangoapp24084:
    build: .
    command: python manage.py runserver 0.0.0.0:25084
    volumes:
      - .:/app
    ports:
      - "25084:25084"
    depends_on:
      - mydb24084
    environment:
      - POSTGRES_NAME=inpc_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=mydb24084
      - POSTGRES_PORT=5432

  mydb24084:
    image: postgis/postgis:13-3.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=inpc_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "24084:5432"

volumes:
  postgres_data:
