{% extends 'base.html' %}
{% block content %}
<h1>Supprimer un Point de Vente</h1>
<p>Êtes-vous sûr de vouloir supprimer ce point de vente ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirmer</button>
    <a href="{% url 'point_of_sale_list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
