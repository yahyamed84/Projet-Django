{% extends 'base.html' %}
{% block content %}
<h1>Supprimer un Panier</h1>
<p>Êtes-vous sûr de vouloir supprimer le panier : <strong>{{ panier.label }}</strong> ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Supprimer</button>
    <a href="{% url 'panier_list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
