{% extends 'base.html' %}
{% load static %}
{% block content %}
<h1>{% if form.instance.pk %}Modifier le Produit{% else %}Ajouter un Produit{% endif %}</h1>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Enregistrer</button>
    <a href="{% url 'product_list' %}" class="btn btn-secondary">Retour</a>
</form>
{% endblock %}
