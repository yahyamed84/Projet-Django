{% extends 'base.html' %}
{% block content %}
<h1>Supprimer une Commune</h1>
<p>Êtes-vous sûr de vouloir supprimer cette commune ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirmer</button>
    <a href="{% url 'commune_list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
