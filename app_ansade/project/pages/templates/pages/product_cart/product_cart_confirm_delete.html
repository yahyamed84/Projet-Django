{% extends 'base.html' %}
{% block content %}
<h1>Supprimer Produit Panier</h1>
<p>Êtes-vous sûr de vouloir supprimer ce produit du panier ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirmer</button>
    <a href="{% url 'product_cart_list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
