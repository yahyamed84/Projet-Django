{% extends 'base.html' %}
{% block content %}
<h1>Ajouter un Produit au Panier</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <a href="{% url 'product_cart_list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
