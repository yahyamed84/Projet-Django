{% extends 'base.html' %}
{% load static %}
{% block content %}
<h1>Confirmer la suppression</h1>
<p>Êtes-vous sûr de vouloir supprimer la Wilaya <strong>{{ wilaya.name }}</strong> ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Supprimer</button>
    <a href="{% url 'wilaya_list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
