{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmer la Suppression</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1>Confirmer la Suppression</h1>
    </header>
    <main>
        <p>Êtes-vous sûr de vouloir supprimer la famille de produit suivante ?</p>
        <p><strong>{{ family.label }}</strong></p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Oui, Supprimer</button>
            <a href="{% url 'product_family_list' %}" class="btn btn-secondary">Annuler</a>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 ANSADE App - Tous droits réservés.</p>
    </footer>
</body>
</html>
