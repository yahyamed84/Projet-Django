{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANSADE App</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="{% url 'home' %}">ANSADE App</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'product_family_list' %}">Famille de produits</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'product_list' %}">Produits</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'panier_list' %}">Panier</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'product_cart_list' %}">Produit panier</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'product_price_list' %}">Prix des produits</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'point_of_sale_list' %}">Points de ventes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'wilaya_list' %}">Wilaya</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'moughataa_list' %}">Moughataa</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'commune_list' %}">Commune</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-light py-3 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2025 ANSADE App - Tous droits réservés (23084)</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
